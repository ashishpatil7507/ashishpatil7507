<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
 <linearGradient id="g" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#38bdf8" stroke-opacity=".045"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
 <style>.name{font:700 58px 'Segoe UI',Arial,sans-serif;fill:#f8fafc;letter-spacing:2px}.role{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#94a3b8;letter-spacing:3px}.tag{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1;letter-spacing:1px}.mono{font:600 12px monospace;fill:#67e8f9}</style>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect width="1200" height="360" rx="22" fill="url(#grid)"/>
<circle cx="1010" cy="160" r="230" fill="url(#glow)"><animate attributeName="r" values="210;245;210" dur="7s" repeatCount="indefinite"/></circle>
<g opacity=".55" stroke="#22d3ee" stroke-width="1">
 <path d="M0 285H270L320 235H430"/><path d="M820 285H930L985 230H1200"/>
 <path d="M0 75H190L230 115H370"/><path d="M850 75H980L1030 115H1200"/>
</g>
<g transform="translate(965 160)">
 <circle r="90" fill="none" stroke="#1e293b" stroke-width="2"/>
 <circle r="70" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="14 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/></circle>
 <circle r="43" fill="none" stroke="#334155" stroke-width="1"/>
 <circle r="14" fill="#22d3ee" filter="url(#blur)"><animate attributeName="r" values="10;15;10" dur="3s" repeatCount="indefinite"/></circle>
 <circle r="7" fill="#e0f2fe"/>
 <g stroke="#22d3ee" stroke-width="2"><path d="M0-108V-82"/><path d="M0 82V108"/><path d="M-108 0H-82"/><path d="M82 0H108"/></g>
</g>
<text x="76" y="120" class="mono">CYBERSECURITY / SOC / VAPT</text>
<text x="76" y="180" class="name">ASHISH PATIL</text>
<text x="78" y="214" class="role">CYBERSECURITY ANALYST • PURPLE TEAM</text>
<g transform="translate(78 255)">
 <rect width="420" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
 <circle cx="18" cy="17" r="5" fill="#22d3ee"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle>
 <text x="32" y="22" class="tag">SOC • DETECTION • THREAT HUNTING • VAPT</text>
</g>
<text x="78" y="318" class="tag">Security telemetry → detection → investigation → hardening</text>
<path d="M42 338H1158" stroke="url(#g)" stroke-width="2" stroke-dasharray="4 14"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="5s" repeatCount="indefinite"/></path>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 50" width="1200" height="50">
<defs>
  <!-- Data Stream Gradients -->
  <linearGradient id="cyanTrack" x1="0" x2="1">
    <stop stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#22d3ee" stop-opacity="1"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  
  <linearGradient id="purpleTrack" x1="0" x2="1">
    <stop stop-color="#8b5cf6" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="1"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </linearGradient>

  <!-- Hardware Glow Filter -->
  <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <style>
    .term { font: 600 9px 'JetBrains Mono', monospace; fill: #475569; letter-spacing: 2px; }
  </style>
</defs>

<!-- Static Base Tracks -->
<path d="M 100 18 H 1100" stroke="#0f172a" stroke-width="2"/>
<path d="M 100 32 H 1100" stroke="#0f172a" stroke-width="2"/>

<!-- Cross-link circuit connections -->
<path d="M 400 18 L 410 32 M 800 32 L 810 18" stroke="#1e293b" stroke-width="1.5"/>

<!-- Top Track: Transmission Stream (Moving Right) -->
<path d="M 100 18 H 1100" stroke="url(#cyanTrack)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120 400" filter="url(#neon)">
  <animate attributeName="stroke-dashoffset" from="520" to="0" dur="3s" repeatCount="indefinite"/>
</path>
<!-- Top Track Data Packet Particles -->
<circle cy="18" r="2" fill="#ffffff" filter="url(#neon)">
  <animate attributeName="cx" values="100;1100" dur="3s" repeatCount="indefinite"/>
</circle>

<!-- Bottom Track: Reception Stream (Moving Left) -->
<path d="M 100 32 H 1100" stroke="url(#purpleTrack)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120 400" filter="url(#neon)">
  <animate attributeName="stroke-dashoffset" from="0" to="520" dur="3.5s" repeatCount="indefinite"/>
</path>
<!-- Bottom Track Data Packet Particles -->
<circle cy="32" r="2" fill="#ffffff" filter="url(#neon)">
  <animate attributeName="cx" values="1100;100" dur="3.5s" repeatCount="indefinite"/>
</circle>

<!-- Terminal Tags -->
<text x="80" y="21" class="term" text-anchor="end">TX_STREAM</text>
<text x="1120" y="35" class="term" text-anchor="start">RX_STREAM</text>

<!-- Central Interlock Node -->
<g transform="translate(600, 25)">
  <!-- Outer Hex Shield -->
  <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#030712" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Counter-Rotating Inner Square -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    <rect x="-6" y="-6" width="12" height="12" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Dual Energy Nodes connecting tracks -->
  <circle cx="0" cy="-7" r="2.5" fill="#22d3ee" filter="url(#neon)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="7" r="2.5" fill="#8b5cf6" filter="url(#neon)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</g>

</svg>

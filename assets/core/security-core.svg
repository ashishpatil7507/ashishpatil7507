<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390">
<defs>
  <!-- Background & Core Gradients -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030612"/><stop offset="1" stop-color="#0a101d"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
  
  <!-- Border Trace Gradients -->
  <linearGradient id="traceCyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#080e1c" stop-opacity="0"/></linearGradient>
  <linearGradient id="tracePurple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#080e1c" stop-opacity="0"/></linearGradient>

  <!-- Ambient Grid (Animated Panning) -->
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="10s" repeatCount="indefinite"/>
    <path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".04"/>
  </pattern>

  <!-- Hardware Glow Filters -->
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".6"/>
  </filter>

  <style>
    .title { font: 800 22px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; letter-spacing: 2px; }
    .sub { font: 600 11px 'JetBrains Mono', monospace; fill: #64748b; letter-spacing: 2px; }
    .h { font: 750 18px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; letter-spacing: 1px; }
    .s { font: 600 11.5px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;}
    .i { font: 500 13.5px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
  </style>
</defs>

<!-- Base Canvas -->
<rect width="1200" height="390" rx="22" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
<rect width="1200" height="390" rx="22" fill="url(#grid)"/>

<!-- Top Header Architecture -->
<text x="600" y="46" text-anchor="middle" class="title">SECURITY OPERATIONS ARCHITECTURE</text>
<text x="600" y="68" text-anchor="middle" class="sub">VISIBILITY  ·  DETECTION  ·  OFFENSE  ·  RESPONSE</text>
<path d="M90 85H1110" stroke="#1e293b" stroke-width="1.5"/>
<path d="M90 85H1110" stroke="url(#accent)" stroke-width="2" stroke-dasharray="80 200" opacity="0.8">
  <animate attributeName="stroke-dashoffset" from="280" to="0" dur="4s" repeatCount="indefinite"/>
</path>

<!-- Data Link Connectors (Background) -->
<g stroke="#1e293b" stroke-width="2">
 <path d="M295 212.5H325"/><path d="M575 212.5H605"/><path d="M855 212.5H885"/>
</g>
<!-- Animated Data Packets Flowing Between Cards -->
<g stroke="url(#flow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
 <path d="M295 212.5H325" stroke-dasharray="10 30"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" repeatCount="indefinite"/></path>
 <path d="M575 212.5H605" stroke-dasharray="10 30"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></path>
 <path d="M855 212.5H885" stroke-dasharray="10 30"><animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></path>
</g>

<!-- ========================================== -->
<!-- BASE CARDS (SHADOWS & BACKGROUNDS)         -->
<!-- ========================================== -->
<g filter="url(#shadow)">
 <rect x="45" y="105" width="250" height="225" rx="16" fill="#080e1c" stroke="#1e293b" stroke-width="1.5"/>
 <rect x="325" y="105" width="250" height="225" rx="16" fill="#080e1c" stroke="#1e293b" stroke-width="1.5"/>
 <rect x="605" y="105" width="250" height="225" rx="16" fill="#080e1c" stroke="#1e293b" stroke-width="1.5"/>
 <rect x="885" y="105" width="270" height="225" rx="16" fill="#080e1c" stroke="#1e293b" stroke-width="1.5"/>
</g>

<!-- ========================================== -->
<!-- ANIMATED CARD PERIMETER TRACES             -->
<!-- ========================================== -->
<g fill="none" stroke-width="2">
  <!-- Card 1 Trace -->
  <rect x="45" y="105" width="250" height="225" rx="16" stroke="url(#traceCyan)" stroke-dasharray="120 830">
    <animate attributeName="stroke-dashoffset" from="950" to="0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <!-- Card 2 Trace -->
  <rect x="325" y="105" width="250" height="225" rx="16" stroke="url(#tracePurple)" stroke-dasharray="120 830">
    <animate attributeName="stroke-dashoffset" from="950" to="0" dur="5s" begin="-1.25s" repeatCount="indefinite"/>
  </rect>
  <!-- Card 3 Trace -->
  <rect x="605" y="105" width="250" height="225" rx="16" stroke="url(#traceCyan)" stroke-dasharray="120 830">
    <animate attributeName="stroke-dashoffset" from="950" to="0" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Card 4 Trace -->
  <rect x="885" y="105" width="270" height="225" rx="16" stroke="url(#tracePurple)" stroke-dasharray="120 870">
    <animate attributeName="stroke-dashoffset" from="990" to="0" dur="5s" begin="-3.75s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Top Scanner Rails on Cards -->
<g stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
 <path d="M65 125H125" stroke-dasharray="35 30"><animate attributeName="stroke-dashoffset" from="65" to="0" dur="3s" repeatCount="indefinite"/></path>
 <path d="M345 125H405" stroke-dasharray="35 30"><animate attributeName="stroke-dashoffset" from="65" to="0" dur="3.5s" repeatCount="indefinite"/></path>
 <path d="M625 125H685" stroke-dasharray="35 30"><animate attributeName="stroke-dashoffset" from="65" to="0" dur="4s" repeatCount="indefinite"/></path>
 <path d="M905 125H965" stroke-dasharray="35 30"><animate attributeName="stroke-dashoffset" from="65" to="0" dur="3.2s" repeatCount="indefinite"/></path>
</g>

<!-- ========================================== -->
<!-- CARD CONTENT & TYPOGRAPHY                  -->
<!-- ========================================== -->

<!-- Card 1: VISIBILITY -->
<text x="70" y="155" class="h">01 / VISIBILITY</text>
<text x="70" y="176" class="s">Enterprise Telemetry</text>
<circle cx="75" cy="203" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
<text x="88" y="208" class="i">Wazuh SIEM/XDR on AWS</text>
<circle cx="75" cy="232" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
<text x="88" y="237" class="i">Sysmon &amp; Event Logging</text>
<circle cx="75" cy="261" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
<text x="88" y="266" class="i">File Integrity Monitoring</text>
<circle cx="75" cy="290" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
<text x="88" y="295" class="i">Govt. ICCC Deployments</text>

<!-- Card 2: DETECTION -->
<text x="350" y="155" class="h">02 / DETECTION</text>
<text x="350" y="176" class="s">Detection Engineering</text>
<circle cx="355" cy="203" r="3.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
<text x="368" y="208" class="i">Custom Rules &amp; Decoders</text>
<circle cx="355" cy="232" r="3.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
<text x="368" y="237" class="i">INNO SOC Dashboards</text>
<circle cx="355" cy="261" r="3.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></circle>
<text x="368" y="266" class="i">Sysmon Config Tuning</text>
<circle cx="355" cy="290" r="3.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="1.8s" repeatCount="indefinite"/></circle>
<text x="368" y="295" class="i">MITRE ATT&amp;CK Mapping</text>

<!-- Card 3: OFFENSE -->
<text x="630" y="155" class="h">03 / OFFENSE</text>
<text x="630" y="176" class="s">Validate &amp; Penetrate</text>
<circle cx="635" cy="203" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
<text x="648" y="208" class="i">Web Application VAPT</text>
<circle cx="635" cy="232" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></circle>
<text x="648" y="237" class="i">OWASP Top 10 Audits</text>
<circle cx="635" cy="261" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="1s" repeatCount="indefinite"/></circle>
<text x="648" y="266" class="i">Burp Suite / Nmap / ZAP</text>
<circle cx="635" cy="290" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="1.5s" repeatCount="indefinite"/></circle>
<text x="648" y="295" class="i">SQLMap &amp; Metasploit</text>

<!-- Card 4: RESPONSE -->
<text x="910" y="155" class="h">04 / RESPONSE</text>
<text x="910" y="176" class="s">Investigate &amp; Harden</text>
<circle cx="915" cy="203" r="3.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
<text x="928" y="208" class="i">Python Security Automation</text>
<circle cx="915" cy="232" r="3.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></circle>
<text x="928" y="237" class="i">Incident Response Playbooks</text>
<circle cx="915" cy="261" r="3.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
<text x="928" y="266" class="i">False Positive Optimization</text>
<circle cx="915" cy="290" r="3.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></circle>
<text x="928" y="295" class="i">Threat Analysis Reporting</text>

<!-- ========================================== -->
<!-- CONTINUOUS LOOP FOOTER                     -->
<!-- ========================================== -->
<!-- Background Rail -->
<path d="M70 355H1130" stroke="#1e293b" stroke-width="2"/>
<!-- Animated Scanning Pulse on Rail -->
<path d="M70 355H1130" stroke="url(#flow)" stroke-width="3" stroke-dasharray="20 200" opacity="0.9" filter="url(#glow)">
 <animate attributeName="stroke-dashoffset" from="220" to="0" dur="2.5s" repeatCount="indefinite"/>
</path>

<!-- Sync Nodes on the Bottom Line -->
<g filter="url(#glow)">
 <circle cx="270" cy="355" r="4" fill="#22d3ee"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
 <circle cx="550" cy="355" r="4" fill="#8b5cf6"><animate attributeName="r" values="3;6;3" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
 <circle cx="830" cy="355" r="4" fill="#22d3ee"><animate attributeName="r" values="3;6;3" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
</g>

<!-- Footer Text -->
<text x="600" y="375" text-anchor="middle" class="sub" fill="#94a3b8">CONTINUOUS SECURITY LOOP  ·  TELEMETRY → DETECTION → VALIDATION → RESPONSE</text>
</svg>

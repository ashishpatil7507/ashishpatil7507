<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".045"/></pattern>
<filter id="g"><feGaussianBlur stdDeviation="4" result="b"><animate attributeName="stdDeviation" values="3;5;3" dur="4s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- Background Elements -->
<rect width="1200" height="390" rx="22" fill="url(#bg)"/>
<rect width="1200" height="390" rx="22" fill="url(#grid)"/>

<!-- Centered Ambient Glow -->
<circle cx="600" cy="195" r="300" fill="url(#glow)"><animate attributeName="r" values="250;320;250" dur="8s" repeatCount="indefinite"/></circle>

<!-- Centered Animated Logo Icon (X = 600 minus half of 74px width) -->
<g transform="translate(563 45)" filter="url(#g)">
<rect width="74" height="74" rx="18" fill="#0f172a" stroke="url(#edge)" stroke-width="2"/>
<path d="M37 17l24 9v18c0 16-10 27-24 34C23 71 13 60 13 44V26l24-9z" fill="none" stroke="#22d3ee" stroke-width="3"/>
<path d="M25 43l8 8 17-19" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Centered Name & Main Titles -->
<text x="600" y="175" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="48" font-weight="700" text-anchor="middle">ASHISH RAMLING PATIL</text>
<text x="600" y="215" fill="#22d3ee" font-family="Segoe UI,Arial" font-size="18" font-weight="600" letter-spacing="3" text-anchor="middle">CYBERSECURITY ANALYST | SOC ENGINEER</text>

<!-- Core Minimalist Skills -->
<text x="600" y="250" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="16" letter-spacing="1" text-anchor="middle">Detection Engineering • Threat Hunting • VAPT</text>

<!-- Centered Animated Divider -->
<g transform="translate(300 295)">
<rect width="600" height="1" fill="url(#edge)" opacity=".7"/>
<circle cx="0" cy="0" r="4" fill="#22d3ee"><animate attributeName="cx" values="0;600;0" dur="6s" repeatCount="indefinite"/></circle>
</g>

<!-- Centered Certifications Footer -->
<text x="600" y="340" fill="#64748b" font-family="JetBrains Mono,monospace" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">CEH v13 (AI)  //  CompTIA SECURITY+</text>

</svg>

<circle r="29" fill="#07111c" stroke="#243244" stroke-width="2"/>
<circle r="21" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="28 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></circle>
<circle r="7" fill="#22d3ee"><animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite"/></circle>
<path d="M-38 0H-27M27 0H38M0-38V-27M0 27V38" stroke="#22d3ee" stroke-width="3"/>
</g>
<text x="600" y="145" text-anchor="middle" class="t tiny">SECURITY OPERATIONS // PROFILE</text>
<text x="600" y="196" text-anchor="middle" class="t title">ASHISH PATIL</text>
<text x="600" y="225" text-anchor="middle" class="t sub">CYBERSECURITY ANALYST • SOC • VAPT • DETECTION ENGINEERING</text>
<text x="230" y="275" text-anchor="middle" class="t tiny">MONITOR</text><text x="600" y="275" text-anchor="middle" class="t tiny">INVESTIGATE</text><text x="970" y="275" text-anchor="middle" class="t tiny">HARDEN</text>
<path d="M300 272H520M680 272H900" stroke="url(#ln)" stroke-width="1.5" stroke-dasharray="6 9"><animate attributeName="stroke-dashoffset" from="0" to="-60" dur="3s" repeatCount="indefinite"/></path>
</svg>
